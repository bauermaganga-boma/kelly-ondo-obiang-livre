<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Back office — Ventes</title>
<link rel="stylesheet" href="/style.css">
<style>
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:22px 0}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:18px}
.stat b{display:block;font:800 1.7rem 'Playfair Display',serif;color:var(--gold)}
.stat span{color:var(--mut);font-size:.85rem}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.bar input,.bar select{width:auto;flex:1;min-width:150px}
.bar .btn{padding:11px 18px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:500;white-space:nowrap}
td select,td input{padding:6px;font-size:.85rem;width:auto}
.scroll{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;background:#2a2a2a}
.pill.paye{background:#12351f;color:#7be0a0}
.pill.non{background:#3a2a10;color:var(--gold2)}
#login{max-width:360px;margin:15vh auto}
#app{display:none;padding:30px 0 60px}
small{color:var(--mut)}
@media print{header,.stats,.bar,.noprint{display:none!important}body{background:#fff;color:#000}th,td{border-color:#999;color:#000}.pill{background:none!important;color:#000!important}}
</style>
</head>
<body>
<header class="noprint"><div class="wrap"><span class="logo">Back office <span>· Ventes</span></span><button class="btn ghost" id="out" style="display:none;padding:7px 14px">Déconnexion</button></div></header>

<div class="wrap" id="login"><div class="card">
  <h2 style="font-size:1.6rem">Connexion</h2>
  <form id="lf"><label>Mot de passe<input type="password" id="pw" required autofocus></label><div class="msg" id="lerr"></div><button class="btn">Entrer</button></form>
</div></div>

<div class="wrap" id="app">
  <div class="stats">
    <div class="stat"><b id="sN">0</b><span>Commandes</span></div>
    <div class="stat"><b id="sQ">0</b><span>Exemplaires</span></div>
    <div class="stat"><b id="sCA">0</b><span>Chiffre d'affaires (hors annulées)</span></div>
    <div class="stat"><b id="sP">0</b><span>Encaissé</span></div>
    <div class="stat"><b id="sL">0</b><span>À livrer</span></div>
  </div>
  <div class="bar noprint">
    <input id="q" placeholder="Rechercher nom, téléphone, ville, référence…">
    <select id="fs"><option value="">Tous les statuts</option></select>
    <button class="btn ghost" id="print">Imprimer</button>
    <a class="btn" href="/api/admin/export.csv">Export Excel (CSV)</a>
  </div>
  <div class="scroll"><table>
    <thead><tr><th>Réf. / date</th><th>Client</th><th>Livraison</th><th>Qté / total</th><th>Paiement</th><th>Statut</th><th class="noprint">Note</th><th class="noprint"></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <p id="empty" style="display:none;color:var(--mut);padding:30px 0">Aucune commande pour le moment.</p>
</div>

<script>
const STATUTS = ['nouvelle', 'confirmée', 'expédiée', 'livrée', 'annulée'];
const $ = (id) => document.getElementById(id);
let data = [];
const money = (n, d = 'FCFA') => n.toLocaleString('fr-FR').replace(/ /g, ' ') + (d === 'EUR' ? ' €' : ' FCFA');
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); kids.forEach((k) => e.append(k)); return e; };

async function call(url, opts) {
  const r = await fetch(url, opts && { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (r.status === 401) { showLogin(); throw new Error('401'); }
  return r.json();
}
const patch = (id, body) => call('/api/admin/commandes/' + id, { method: 'PATCH', body: JSON.stringify(body) });

function showLogin() { $('login').style.display = ''; $('app').style.display = 'none'; $('out').style.display = 'none'; }
function showApp() { $('login').style.display = 'none'; $('app').style.display = 'block'; $('out').style.display = ''; }

$('fs').append(...STATUTS.map((s) => el('option', { value: s, textContent: s })));

$('lf').onsubmit = async (e) => {
  e.preventDefault();
  const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('pw').value }) });
  if (r.ok) { showApp(); load(); } else { $('lerr').textContent = 'Mot de passe incorrect.'; $('lerr').className = 'msg err'; }
};
$('out').onclick = async () => { await fetch('/api/admin/logout', { method: 'POST' }); $('pw').value = ''; showLogin(); };
$('print').onclick = () => window.print();
$('q').oninput = $('fs').onchange = render;

async function load() { data = await call('/api/admin/commandes'); render(); }

function render() {
  const live = data.filter((c) => c.statut !== 'annulée');
  $('sN').textContent = data.length;
  $('sQ').textContent = live.reduce((a, c) => a + c.quantite, 0);
  const sum = (l) => money(l.filter((c) => c.devise !== 'EUR').reduce((x, c) => x + c.total, 0)) + (l.some((c) => c.devise === 'EUR') ? ' + ' + money(l.filter((c) => c.devise === 'EUR').reduce((x, c) => x + c.total, 0), 'EUR') : '');
  $('sCA').textContent = sum(live);
  $('sP').textContent = sum(live.filter((c) => c.paye));
  $('sL').textContent = data.filter((c) => ['nouvelle', 'confirmée', 'expédiée'].includes(c.statut)).length;

  const q = $('q').value.toLowerCase(), fs = $('fs').value;
  const list = data.filter((c) => (!fs || c.statut === fs) && (!q || [c.nom, c.telephone, c.ville, c.quartier, c.adresse, c.reference, c.email].join(' ').toLowerCase().includes(q)));
  $('empty').style.display = list.length ? 'none' : 'block';

  $('rows').replaceChildren(...list.map((c) => {
    const st = el('select');
    STATUTS.forEach((s) => st.append(el('option', { value: s, textContent: s, selected: s === c.statut })));
    st.onchange = async () => { await patch(c.id, { statut: st.value }); c.statut = st.value; render(); };
    const paid = el('input', { type: 'checkbox', checked: !!c.paye });
    paid.onchange = async () => { await patch(c.id, { paye: paid.checked }); c.paye = paid.checked ? 1 : 0; render(); };
    const note = el('input', { value: c.note || '', placeholder: 'note…' });
    note.onchange = () => patch(c.id, { note: note.value });
    const del = el('button', { className: 'btn ghost', textContent: '✕', title: 'Supprimer', style: 'padding:4px 10px' });
    del.onclick = async () => { if (confirm(`Supprimer définitivement la commande ${c.reference} ?`)) { await call('/api/admin/commandes/' + c.id, { method: 'DELETE' }); load(); } };
    const tel = el('a', { href: 'tel:' + c.telephone, textContent: c.telephone });
    const wa = el('a', { href: 'https://wa.me/' + c.telephone.replace(/\D/g, ''), target: '_blank', rel: 'noopener', textContent: ' · WhatsApp', className: 'noprint' });
    return el('tr', {},
      el('td', {}, el('b', { textContent: c.reference }), el('br'), el('small', { textContent: new Date(c.date).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) })),
      el('td', {}, el('b', { textContent: c.nom }), el('br'), tel, wa, ...(c.email ? [el('br'), el('small', { textContent: c.email })] : [])),
      el('td', {}, el('b', { textContent: c.ville + (c.quartier ? ' — ' + c.quartier : '') }), el('br'), el('small', { textContent: c.adresse })),
      el('td', {}, `${c.quantite} ex.`, el('br'), el('b', { textContent: money(c.total, c.devise) })),
      el('td', {}, c.paiement, el('br'), el('span', { className: 'pill ' + (c.paye ? 'paye' : 'non'), textContent: c.paye ? 'payé' : 'à encaisser' }), ' ', el('label', { className: 'noprint', style: 'display:inline;font-size:.78rem' }, paid, ' payé')),
      el('td', {}, st),
      el('td', { className: 'noprint' }, note),
      el('td', { className: 'noprint' }, del));
  }));
}

call('/api/admin/commandes').then((d) => { data = d; showApp(); render(); }).catch(() => {});
</script>
</body>
</html>
